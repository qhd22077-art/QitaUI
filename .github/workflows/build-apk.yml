name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: QitaUI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QitaUI-debug.apk
      - name: Publish release
        if: github.ref == 'refs/heads/claude/ps-vita-android-software-w7vqu2' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QitaUI build ${{ github.run_number }}
          body: |
            Debug build of QitaUI from commit ${{ github.sha }}.
            Download `QitaUI-debug.apk` below and install it on your Android device.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: QitaUI-debug.apk

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Android Lint
        run: gradle :app:lintDebug --no-daemon
